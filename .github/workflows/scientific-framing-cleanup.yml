name: Scientific framing cleanup

on:
  push:
    branches:
      - cleanup/scientific-framing
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/scientific-framing

      - name: Remove course-specific framing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          allowed = {'.py', '.md', '.yml', '.yaml', '.txt'}
          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if '.git' in path.parts or '.github' in path.parts or 'results' in path.parts:
                  continue
              if path.suffix.lower() not in allowed:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              updated = text.replace('DSAI543_DATA', 'LUNG_WSI_DATA')
              updated = updated.replace(' DSAI 543, Bogazici University.', '')
              updated = updated.replace('DSAI 543, Bogazici University.', '')
              updated = updated.replace('Baseline 1 from proposal', 'RBF-SVM baseline')
              updated = updated.replace('project submission', 'benchmark evaluation')

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify source cleanup
        shell: bash
        run: |
          if git grep -nEi 'DSAI[ _-]?543|Bogazici|Boğaziçi' -- ':!.github/**' ':!results/**'; then
            echo 'Course-specific identifiers remain.'
            exit 1
          fi
          python -m compileall -q . -x 'results|.git|.github'

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Remove course-specific project framing'
          git push origin HEAD:cleanup/scientific-framing
