name: Apply script layout rewrites

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  rewrite:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/script-layout'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Rewrite embedded usage examples
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "python3 train.py": "python -m scripts.training.train",
              "python train.py": "python -m scripts.training.train",
              "python3 train_classical.py": "python -m scripts.training.train_classical",
              "python train_classical.py": "python -m scripts.training.train_classical",
              "python3 train_intermediate.py": "python -m scripts.training.train_intermediate",
              "python train_intermediate.py": "python -m scripts.training.train_intermediate",
              "python3 evaluate.py": "python -m scripts.evaluation.evaluate",
              "python evaluate.py": "python -m scripts.evaluation.evaluate",
              "python3 eval_checkpoint.py": "python -m scripts.evaluation.eval_checkpoint",
              "python eval_checkpoint.py": "python -m scripts.evaluation.eval_checkpoint",
              "python3 cptac_inference.py": "python -m scripts.evaluation.cptac_inference",
              "python cptac_inference.py": "python -m scripts.evaluation.cptac_inference",
              "python3 bootstrap_ci.py": "python -m scripts.evaluation.bootstrap_ci",
              "python bootstrap_ci.py": "python -m scripts.evaluation.bootstrap_ci",
              "python3 learning_curve.py": "python -m scripts.evaluation.learning_curve",
              "python learning_curve.py": "python -m scripts.evaluation.learning_curve",
              "python3 attention_stats.py": "python -m scripts.analysis.attention_stats",
              "python attention_stats.py": "python -m scripts.analysis.attention_stats",
              "python3 attention_heatmap.py": "python -m scripts.analysis.attention_heatmap",
              "python attention_heatmap.py": "python -m scripts.analysis.attention_heatmap",
              "python3 counterfactual_tile_removal.py": "python -m scripts.analysis.counterfactual_tile_removal",
              "python counterfactual_tile_removal.py": "python -m scripts.analysis.counterfactual_tile_removal",
              "python3 make_attention_grid.py": "python -m scripts.figures.make_attention_grid",
              "python make_attention_grid.py": "python -m scripts.figures.make_attention_grid",
              "python3 make_cptac_figures.py": "python -m scripts.figures.make_cptac_figures",
              "python make_cptac_figures.py": "python -m scripts.figures.make_cptac_figures",
              "python3 make_disagreement_attention_grid_v2.py": "python -m scripts.figures.make_disagreement_attention_grid_v2",
              "python make_disagreement_attention_grid_v2.py": "python -m scripts.figures.make_disagreement_attention_grid_v2",
              "python3 make_disagreement_grid_v3.py": "python -m scripts.figures.make_disagreement_grid_v3",
              "python make_disagreement_grid_v3.py": "python -m scripts.figures.make_disagreement_grid_v3",
              "python3 make_ieee_figures.py": "python -m scripts.figures.make_ieee_figures",
              "python make_ieee_figures.py": "python -m scripts.figures.make_ieee_figures",
              "python3 cptac_download_and_extract.py": "python -m scripts.data_prep.cptac_download_and_extract",
              "python cptac_download_and_extract.py": "python -m scripts.data_prep.cptac_download_and_extract",
          }

          changed = []
          for path in Path("scripts").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Updated usage examples:")
          for path in changed:
              print(f"  {path}")

          for temporary in [
              Path("docs/superpowers/specs/2026-08-29-script-layout-design.md"),
              Path("docs/superpowers/plans/2026-08-29-script-layout-plan.md"),
              Path(".github/workflows/apply-script-layout-rewrites.yml"),
          ]:
              if temporary.exists():
                  temporary.unlink()

      - name: Commit rewrite
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rewrite changes needed."
            exit 0
          fi
          git commit -m "docs: update moved script usage examples"
          git push origin "HEAD:${{ github.head_ref }}"
